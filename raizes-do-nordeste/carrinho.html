<html lang="pt-BR">
<head>

<body>

      <p class="sobretitulo">SEU PEDIDO</p>
      <h1>Meu carrinho 🛒</h1>
      <p>Confira os itens antes de continuar.</p>

    <div class="unidade-resumo" id="resumoUnidade"></div>
    <section id="itensCarrinho" class="itens-carrinho" aria-live="polite"></section>

    <section class="resumo-pedido" id="resumoPedido">
      <div class="linha-resumo"><span>Subtotal</span><strong id="subtotal">R$ 0,00</strong></div>
      <div class="linha-resumo total"><span>Total</span><strong id="total">R$ 0,00</strong></div>
      <button class="botao-principal" id="botaoContinuar" type="button">Continuar pedido</button>
      <p class="ajuda">Pagamento demonstrativo. Nenhuma cobrança real será realizada.</p>
    </section>
    <a class="link-voltar" href="index.html">← Voltar ao cardápio</a>
